<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Jason! 🎉</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #cakeCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: crosshair;
    }
    .message-card {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: 90%;
      max-width: 650px;
      padding: 16px 24px;
      background: rgba(10, 5, 20, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 0, 128, 0.4);
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 0, 128, 0.3),
                  0 0 15px rgba(0, 210, 255, 0.2);
      pointer-events: none;
    }
    .bday-title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ff007f;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255, 0, 128, 0.9),
                   0 0 20px rgba(0, 255, 204, 0.6);
      margin-bottom: 6px;
    }
    .bday-msg {
      font-size: 13.5px;
      line-height: 1.5;
      color: #f0f0f0;
      letter-spacing: 0.5px;
      text-shadow: 0 0 8px rgba(0, 210, 255, 0.5);
    }
    .hint {
      position: absolute;
      top: 18px;
      width: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 0 8px rgba(255, 0, 128, 0.5);
    }
  </style>
</head>
<body>

  <div class="hint">Click anywhere to launch fireworks! 🎆</div>
  <canvas id="cakeCanvas"></canvas>

  <div class="message-card">
    <div class="bday-title">🎉 HAPPY BIRTHDAY JASON! 🎉</div>
    <div class="bday-msg">
      To my best friend: thank you for always having my back and bringing so much light into life. May this year bring you endless success, joy, and unforgettable moments! Keep shining bright! 🥳✨
    </div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('cakeCanvas');
      const ctx = canvas.getContext('2d');

      let width = 0;
      let height = 0;
      const rand = Math.random;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      // --- PARAMETRIC CAKE POINT GENERATOR ---
      function generateCakePoints() {
        const pts = [];

        function addLine(x1, y1, x2, y2, density) {
          for (let t = 0; t <= 1; t += 1 / density) {
            pts.push([x1 + (x2 - x1) * t, y1 + (y2 - y1) * t]);
          }
        }

        function addEllipse(cx, cy, rx, ry, count) {
          for (let i = 0; i < count; i++) {
            const a = (i / count) * Math.PI * 2;
            pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);
          }
        }

        // 1. Serving Platter
        addEllipse(0, 160, 190, 32, 110);

        // 2. Bottom Tier
        addEllipse(0, 150, 145, 22, 90);
        addEllipse(0, 80, 145, 22, 90);
        addLine(-145, 80, -145, 150, 25);
        addLine(145, 80, 145, 150, 25);

        // 3. Middle Tier
        addEllipse(0, 80, 100, 16, 75);
        addEllipse(0, 20, 100, 16, 75);
        addLine(-100, 20, -100, 80, 22);
        addLine(100, 20, 100, 80, 22);

        // 4. Top Tier
        addEllipse(0, 20, 65, 11, 55);
        addEllipse(0, -40, 65, 11, 55);
        addLine(-65, -40, -65, 20, 18);
        addLine(65, -40, 65, 20, 18);

        // 5. Candles (Left, Middle, Right)
        const candleXs = [-32, 0, 32];
        candleXs.forEach(function (cx) {
          addLine(cx, -40, cx, -75, 18);
          // Flame teardrop
          for (let a = 0; a < Math.PI * 2; a += 0.25) {
            pts.push([cx + Math.sin(a) * 6, -88 + Math.cos(a) * 11]);
          }
        });

        // 6. Garland Light Strings
        [145, 100, 65].forEach(function(r, idx) {
          const yBase = 115 - idx * 60;
          for (let i = 0; i < 35; i++) {
            const a = (i / 35) * Math.PI * 2;
            pts.push([Math.cos(a) * (r + 8), yBase + Math.sin(a) * 12]);
          }
        });

        return pts;
      }

      const cakePointsOrigin = generateCakePoints();
      const cakePointsCount = cakePointsOrigin.length;

      // Particle Swarm Array for Cake
      const traceCount = 35;
      const cakeParticles = [];
      const targetPoints = [];

      for (let i = 0; i < cakePointsCount; i++) {
        const x = rand() * (width || 800);
        const y = rand() * (height || 600);
        const hue = (i % 4 === 0) ? 330 : (i % 4 === 1) ? 190 : (i % 4 === 2) ? 45 : 280;

        const p = {
          vx: 0,
          vy: 0,
          speed: rand() * 4 + 3,
          q: Math.floor(rand() * cakePointsCount),
          D: 2 * (i % 2) - 1,
          force: 0.2 * rand() + 0.75,
          f: "hsla(" + hue + "," + Math.floor(50 * rand() + 50) + "%," + Math.floor(60 * rand() + 30) + "%,.5)",
          trace: []
        };

        for (let k = 0; k < traceCount; k++) {
          p.trace[k] = { x: x, y: y };
        }
        cakeParticles.push(p);
      }

      // --- FIREWORKS ENGINE ---
      const fireworks = [];

      function createFirework(tx, ty) {
        const startX = rand() * width;
        const startY = height;
        const targetX = tx !== undefined ? tx : rand() * width;
        const targetY = ty !== undefined ? ty : rand() * (height * 0.45) + 50;
        const hue = Math.floor(rand() * 360);

        fireworks.push({
          x: startX,
          y: startY,
          targetX: targetX,
          targetY: targetY,
          speed: rand() * 5 + 8,
          angle: Math.atan2(targetY - startY, targetX - startX),
          particles: [],
          exploded: false,
          hue: hue
        });
      }

      function updateFireworks() {
        // Random background launch
        if (rand() < 0.04) {
          createFirework();
        }

        for (let i = fireworks.length - 1; i >= 0; i--) {
          const fw = fireworks[i];

          if (!fw.exploded) {
            fw.x += Math.cos(fw.angle) * fw.speed;
            fw.y += Math.sin(fw.angle) * fw.speed;

            // Rocket stroke
            ctx.save();
            ctx.strokeStyle = "hsl(" + fw.hue + ", 100%, 70%)";
            ctx.lineWidth = 2.5;
            ctx.shadowColor = "hsl(" + fw.hue + ", 100%, 50%)";
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.moveTo(fw.x - Math.cos(fw.angle) * 12, fw.y - Math.sin(fw.angle) * 12);
            ctx.lineTo(fw.x, fw.y);
            ctx.stroke();
            ctx.restore();

            const dist = Math.hypot(fw.targetX - fw.x, fw.targetY - fw.y);
            if (dist < 18 || fw.y <= fw.targetY) {
              fw.exploded = true;
              const pCount = 60;
              for (let j = 0; j < pCount; j++) {
                const pAngle = rand() * Math.PI * 2;
                const pSpeed = rand() * 7 + 1.5;
                fw.particles.push({
                  x: fw.x,
                  y: fw.y,
                  vx: Math.cos(pAngle) * pSpeed,
                  vy: Math.sin(pAngle) * pSpeed,
                  alpha: 1,
                  decay: rand() * 0.025 + 0.012,
                  hue: fw.hue + (rand() * 40 - 20)
                });
              }
            }
          } else {
            for (let k = fw.particles.length - 1; k >= 0; k--) {
              const p = fw.particles[k];
              p.x += p.vx;
              p.y += p.vy;
              p.vy += 0.09; // Gravity
              p.vx *= 0.95;
              p.vy *= 0.95;
              p.alpha -= p.decay;

              if (p.alpha > 0) {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = "hsl(" + p.hue + ", 100%, 65%)";
                ctx.shadowColor = "hsl(" + p.hue + ", 100%, 50%)";
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(p.x, p.y, rand() * 2 + 1, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
              } else {
                fw.particles.splice(k, 1);
              }
            }

            if (fw.particles.length === 0) {
              fireworks.splice(i, 1);
            }
          }
        }
      }

      // Interactive Click Fireworks
      canvas.addEventListener('click', function(e) {
        const rect = canvas.getBoundingClientRect();
        createFirework(e.clientX - rect.left, e.clientY - rect.top);
      });

      // --- ANIMATION LOOP ---
      let time = 0;
      const traceK = 0.35;

      function updatePulse(kx, ky) {
        const scale = Math.min(width, height) / 520;
        for (let i = 0; i < cakePointsCount; i++) {
          targetPoints[i] = [
            kx * cakePointsOrigin[i][0] * scale + width / 2,
            ky * cakePointsOrigin[i][1] * scale + height / 2 - 25
          ];
        }
      }

      function loop() {
        const n = -Math.cos(time);
        updatePulse(1 + n * 0.025, 1 + n * 0.025);
        time += ((Math.sin(time)) < 0 ? 9 : (n > 0.8) ? 0.2 : 1) * 0.01;

        // Semi-transparent wipe for trail effect
        ctx.fillStyle = "rgba(0,0,0,0.18)";
        ctx.fillRect(0, 0, width, height);

        // 1. Fireworks in background
        updateFireworks();

        // 2. Swarming Cake Particles
        for (let i = cakeParticles.length - 1; i >= 0; i--) {
          const u = cakeParticles[i];
          const q = targetPoints[u.q];
          if (!q) continue;

          const dx = u.trace[0].x - q[0];
          const dy = u.trace[0].y - q[1];
          const length = Math.sqrt(dx * dx + dy * dy);

          if (length < 10) {
            if (rand() > 0.95) {
              u.q = Math.floor(rand() * cakePointsCount);
            } else {
              if (rand() > 0.99) u.D *= -1;
              u.q += u.D;
              u.q %= cakePointsCount;
              if (u.q < 0) u.q += cakePointsCount;
            }
          }

          u.vx += (-dx / (length || 1)) * u.speed;
          u.vy += (-dy / (length || 1)) * u.speed;
          u.trace[0].x += u.vx;
          u.trace[0].y += u.vy;
          u.vx *= u.force;
          u.vy *= u.force;

          for (let k = 0; k < u.trace.length - 1; k++) {
            const T = u.trace[k];
            const N = u.trace[k + 1];
            N.x -= traceK * (N.x - T.x);
            N.y -= traceK * (N.y - T.y);
          }

          ctx.fillStyle = u.f;
          for (let k = 0; k < u.trace.length; k++) {
            ctx.fillRect(u.trace[k].x, u.trace[k].y, 1.5, 1.5);
          }
        }

        requestAnimationFrame(loop);
      }

      loop();
    })();
  </script>
</body>
</html>
